# Portal TCC — ambiente completo (banco + aplicação)
#
#   cp .env.example .env    # cole a chave do Google
#   docker compose up
#
# Acesse http://localhost:8000

services:
  db:
    # Imagem com a extensão TimescaleDB já instalada. Versão fixa para que uma
    # atualização não altere o create_hypertable() de db/connection.py.
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-portaltcc}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # O backend só inicia depois que este teste passa (ver depends_on).
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portaltcc}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      # Contexto na raiz: a imagem copia backend/ e frontend/.
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Definido aqui, e não no .env, para sempre apontar ao serviço 'db' do
      # compose mesmo que o .env local tenha um DATABASE_URL de localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-portaltcc}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CHROMA_PERSIST_DIR: /app/chroma_db
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
